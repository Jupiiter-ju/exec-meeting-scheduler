name: Deploy Pages

on:
  push:
    branches: [master, Developer]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master (production)
        uses: actions/checkout@v4
        with:
          ref: master
          path: prod

      - name: Checkout Developer (staging)
        uses: actions/checkout@v4
        with:
          ref: Developer
          path: dev

      - name: Assemble site
        run: |
          mkdir -p site/dev
          cp prod/index.html site/index.html
          cp dev/index.html site/dev/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
